<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Airlock</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="hdr">
  <div class="brand">
    <div class="logo-tile" aria-hidden="true">A</div>
    <span class="brand__product">AIRLOCK</span>
    <span class="brand__tag" id="version">STUDIO // v0.1</span>
  </div>
  <div class="hdr__right">
    <span class="project">project <b id="project-name"></b></span>
    <span class="live" id="live">
      <span class="pulse" id="live-dot" aria-hidden="true"></span>
      <span id="live-label">CONNECTING</span>
    </span>
  </div>
</header>

<section class="hero" aria-label="State of the airlock">
  <div class="stats" id="hero-stats"></div>
  <div class="now">
    <div class="label">In the airlock now</div>
    <div class="now__rows" id="hero-now"></div>
  </div>
</section>

<nav class="nav">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="filters" id="filters">
    <span class="filter-group" id="board-filters" role="group" aria-label="Track and priority filters"></span>
    <span class="filter-group" id="role-filter" role="group" aria-label="Role filter"></span>
  </div>
</nav>

<main id="view" tabindex="-1"></main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer__body" id="drawer-body"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
