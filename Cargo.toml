[package]
name = "airlock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Peter Paprotny <pappet@web.de>"]
description = "Local-first multi-agent workflow coordinator and task management hub"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dirs = "7.0.0"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
