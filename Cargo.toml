[package]
name = "airlock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Peter Paprotny <pappet@web.de>"]
description = "Local-first multi-agent workflow coordinator and task management hub"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dirs = "7.0.0"
uuid = { version = "1.26.1", features = ["v4"] }
sha2 = "0.11.0"
toml = "1.1.8"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
getrandom = "0.4.3"
futures-util = { version = "0.3.34", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
